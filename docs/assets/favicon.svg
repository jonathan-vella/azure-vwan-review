<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Azure VWAN Review">
  <rect width="64" height="64" rx="12" fill="#1f6feb"/>
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- central hub -->
    <circle cx="32" cy="32" r="6" fill="#ffffff" stroke="none"/>
    <!-- spokes -->
    <line x1="32" y1="32" x2="14" y2="14"/>
    <line x1="32" y1="32" x2="50" y2="14"/>
    <line x1="32" y1="32" x2="14" y2="50"/>
    <line x1="32" y1="32" x2="50" y2="50"/>
    <line x1="32" y1="32" x2="56" y2="32"/>
    <line x1="32" y1="32" x2="8" y2="32"/>
    <!-- spoke endpoints -->
    <circle cx="14" cy="14" r="3" fill="#ffffff" stroke="none"/>
    <circle cx="50" cy="14" r="3" fill="#ffffff" stroke="none"/>
    <circle cx="14" cy="50" r="3" fill="#ffffff" stroke="none"/>
    <circle cx="50" cy="50" r="3" fill="#ffffff" stroke="none"/>
    <circle cx="56" cy="32" r="3" fill="#ffffff" stroke="none"/>
    <circle cx="8" cy="32" r="3" fill="#ffffff" stroke="none"/>
  </g>
</svg>
